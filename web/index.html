<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plugin Harness</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="icon.svg" alt="" width="26" height="26" />
        <div>
          <div class="brand-name">Plugin Harness</div>
          <div class="brand-sub" id="host-version"></div>
        </div>
      </div>
      <nav id="nav">
        <a href="#chat" data-page="chat"><span class="ico">💬</span>对话</a>
        <a href="#plugins" data-page="plugins"><span class="ico">🧩</span>已安装<span class="count" id="nav-plugins-count"></span></a>
        <a href="#discover" data-page="discover"><span class="ico">✨</span>发现<span class="count dot" id="nav-updates"></span></a>
        <a href="#logs" data-page="logs"><span class="ico">📜</span>日志<span class="count warn" id="nav-errors"></span></a>
        <a href="#settings" data-page="settings"><span class="ico">⚙️</span>设置</a>
      </nav>
      <div class="session-panel" id="session-panel">
        <button class="btn session-new" id="session-new"><span>＋</span> 新对话</button>
        <div class="session-list" id="session-list"></div>
      </div>
      <div class="sidebar-foot" id="conn">连接中…</div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
